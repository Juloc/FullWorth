name: CI

# CI is manual by design — run it from the Actions tab or `gh workflow run CI`.
# Do not add push, pull_request, schedule, merge_group, or other automatic triggers.
#
# The backend integration suite (~210 classes, each starting its own WebApplicationFactory host +
# cloned Postgres DB) is the whole cost. It is sharded across parallel jobs by test namespace.
# Juloc/FullWorth is public, so parallel jobs cost no Actions minutes.
#
# The "rest" shard is the COMPLEMENT of every other one (a NOT-filter), so any namespace not explicitly
# assigned still runs there — new test areas can never silently fall out of CI. Keep it that way when
# adding a shard: name the namespaces in the new shard AND add them to the NOT-chain.
#
# Two measurements shaped the current layout (run 35149960672, 9 min 21 s wall clock):
#   - "rest" alone was 642 tests in 7 m 46 s while every other shard sat between 1 and 3 minutes.
#     Three of its namespace groups are their own shards now (accounts, platform).
#   - Each shard spends ~68 s restoring and building before the first test runs. That is NOT worth
#     replacing with a build-once-and-share artifact: the shards would then have to WAIT for that
#     build instead of running beside it, and 72 s + upload + download is more than the 68 s saved.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Command Timeout well above the default so a query that runs slowly under load does not surface as an
  # intermittent Npgsql timeout. Sharding keeps per-job parallelism low, so connection pressure stays small.
  FULLWORTH_TEST_POSTGRES: Host=localhost;Port=5432;Username=fullworth_test;Password=fullworth_test_password;Command Timeout=120;Timeout=30

jobs:
  # Compile the whole solution (incl. projects no test references, e.g. CodexBridge) so a build break
  # anywhere still fails CI. Runs in parallel with the test shards, so it does not add wall-clock.
  build:
    name: Build (all projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build FullWorth.slnx --configuration Release

  backend-tests:
    name: Backend · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: purchases
            filter: "FullyQualifiedName~.Purchases.|FullyQualifiedName~.Parity.|FullyQualifiedName~.Performance.|FullyQualifiedName~.Preferences."
          - name: api
            filter: "FullyQualifiedName~.Api."
          - name: contracts
            filter: "FullyQualifiedName~.Contracts.|FullyQualifiedName~.Loans.|FullyQualifiedName~.Import."
          - name: intelligence
            filter: "FullyQualifiedName~.Intelligence.|FullyQualifiedName~.Security.|FullyQualifiedName~.Tax.|FullyQualifiedName~.Budgets."
          - name: portfolio
            filter: "FullyQualifiedName~.Portfolio.|FullyQualifiedName~.Transactions."
          - name: analytics
            filter: "FullyQualifiedName~.Analytics.|FullyQualifiedName~.Categories.|FullyQualifiedName~.BankConnections."
          - name: accounts
            filter: "FullyQualifiedName~.Accounts.|FullyQualifiedName~.Compensation.|FullyQualifiedName~.Pension."
          - name: platform
            filter: "FullyQualifiedName~.Migrations.|FullyQualifiedName~.Ingestion.|FullyQualifiedName~.Infrastructure.|FullyQualifiedName~.Coach.|FullyQualifiedName~.Architecture."
          - name: rest
            filter: "FullyQualifiedName!~.Purchases.&FullyQualifiedName!~.Parity.&FullyQualifiedName!~.Performance.&FullyQualifiedName!~.Preferences.&FullyQualifiedName!~.Api.&FullyQualifiedName!~.Contracts.&FullyQualifiedName!~.Loans.&FullyQualifiedName!~.Import.&FullyQualifiedName!~.Intelligence.&FullyQualifiedName!~.Security.&FullyQualifiedName!~.Tax.&FullyQualifiedName!~.Budgets.&FullyQualifiedName!~.Portfolio.&FullyQualifiedName!~.Transactions.&FullyQualifiedName!~.Analytics.&FullyQualifiedName!~.Categories.&FullyQualifiedName!~.BankConnections.&FullyQualifiedName!~.Accounts.&FullyQualifiedName!~.Compensation.&FullyQualifiedName!~.Pension.&FullyQualifiedName!~.Migrations.&FullyQualifiedName!~.Ingestion.&FullyQualifiedName!~.Infrastructure.&FullyQualifiedName!~.Coach.&FullyQualifiedName!~.Architecture."
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name fullworth-postgres \
            -e POSTGRES_USER=fullworth_test \
            -e POSTGRES_PASSWORD=fullworth_test_password \
            -e POSTGRES_DB=fullworth_test \
            -p 5432:5432 \
            --shm-size=1g \
            postgres:18 -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c shared_buffers=256MB
          for i in $(seq 1 30); do
            if docker exec fullworth-postgres pg_isready -U fullworth_test -d fullworth_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"; docker logs fullworth-postgres; exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # xunit.runner.json sagt zwei Threads, der Runner hat vier Kerne - gemessen lief jeder Shard
      # damit auf halber Maschine. Hier und nicht in der Datei, weil dieselbe Datei lokal gilt und
      # Docker Desktop dort ohnehin schon unter der Last leidet.
      - name: Test (${{ matrix.name }})
        run: dotnet test tests/FullWorth.Backend.Tests/FullWorth.Backend.Tests.csproj --configuration Release --filter "${{ matrix.filter }}" -- xUnit.MaxParallelThreads=4

  other-tests:
    name: Web + Banking + FinTs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name fullworth-postgres \
            -e POSTGRES_USER=fullworth_test \
            -e POSTGRES_PASSWORD=fullworth_test_password \
            -e POSTGRES_DB=fullworth_test \
            -p 5432:5432 \
            --shm-size=1g \
            postgres:18 -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c shared_buffers=256MB
          for i in $(seq 1 30); do
            if docker exec fullworth-postgres pg_isready -U fullworth_test -d fullworth_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"; docker logs fullworth-postgres; exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Ohne die Klassen, die einen Browser brauchen: den installiert dieser Shard bewusst nicht, sie
      # laufen im eigenen Job "Layout stability".
      #
      # Gefiltert wird nach der Markierung, nicht nach dem Klassennamen. Vorher stand hier
      # "!~LayoutStability", und die zweite Messklasse fiel damit in diesen Shard: zwoelf Tests, alle
      # rot, alle mit "Executable doesn't exist". Wer eine dritte schreibt, setzt [Trait] und ist fertig.
      - name: Test Web
        run: dotnet test tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj --configuration Release --filter "Needs!=Browser"

      - name: Test Banking
        run: dotnet test tests/FullWorth.Banking.Tests/FullWorth.Banking.Tests.csproj --configuration Release

      - name: Test FinTs
        run: dotnet test tests/FullWorth.FinTs.Tests/FullWorth.FinTs.Tests.csproj --configuration Release

  # The Codex bridge lives in the application image now, under its own user. Nothing in the .NET suite
  # can see that: the users, the file modes and the fact that Codex resolves its own native binary are
  # properties of the IMAGE, and the one time they were wrong (a symlink COPY dereferenced into the
  # wrong directory) everything still compiled and every test still passed.
  #
  # Only the Codex stage is built here, not the whole image - the .NET publish and the Playwright base
  # are already covered, and this job has to stay cheap enough to run on every CI invocation.
  codex-image:
    name: Codex in the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the Codex stage
        run: docker build --target codex -t fullworth-codex-stage -f src/FullWorth.Web/Dockerfile .

      - name: Assemble the runtime layout
        run: |
          cat > Dockerfile.codex-check <<'DOCKERFILE'
          FROM fullworth-codex-stage AS codex
          FROM debian:bookworm-slim
          RUN (getent group app || groupadd --system app) \
           && (id -u app || useradd --system --gid app --create-home app) \
           && (getent group codex || groupadd --system --gid 1990 codex) \
           && (id -u codex || useradd --system --uid 1990 --gid codex --no-create-home --home-dir /data/codex codex)
          COPY --from=codex /usr/local/bin/node /usr/local/bin/node
          COPY --from=codex /usr/local/lib/node_modules/@openai /usr/local/lib/node_modules/@openai
          RUN ln -s /usr/local/lib/node_modules/@openai/codex/bin/codex.js /usr/local/bin/codex-real
          DOCKERFILE
          docker build -t fullworth-codex-check -f Dockerfile.codex-check .

      - name: Node, Codex and the codex user are all really there
        run: |
          docker run --rm fullworth-codex-check node --version
          docker run --rm fullworth-codex-check ldd /usr/local/bin/node
          docker run --rm fullworth-codex-check id codex
          # The one that actually catches a broken copy: the CLI has to find its own platform binary.
          docker run --rm fullworth-codex-check codex-real --version

      - name: The launcher and the entrypoint are valid POSIX shell
        run: |
          sh -n ops/docker/fullworth-codex-launcher
          sh -n ops/docker/entrypoint.sh

      # The boundary between the application and Codex is file ownership and nothing else, so it can
      # only be checked by running the entrypoint and trying. Both holes found so far were invisible
      # to every other test: secrets written world-readable, and a data-protection key ring a second
      # uid could list - with which it could forge a sign-in cookie.
      - name: The entrypoint really establishes the privilege separation
        run: |
          cat > Dockerfile.modes <<'DOCKERFILE'
          FROM debian:bookworm-slim
          RUN apt-get update \
           && apt-get install -y --no-install-recommends gosu \
           && rm -rf /var/lib/apt/lists/* \
           && groupadd --system app \
           && useradd --system --gid app --create-home app \
           && groupadd --system --gid 1990 codex \
           && useradd --system --uid 1990 --gid codex --no-create-home --home-dir /data/codex codex
          COPY ops/docker/entrypoint.sh /usr/local/bin/entrypoint.sh
          COPY ops/docker/fullworth-codex-launcher /usr/local/bin/fullworth-codex-launcher
          COPY ops/docker/verify-privilege-separation.sh /usr/local/bin/verify-privilege-separation
          RUN chmod 0755 /usr/local/bin/entrypoint.sh /usr/local/bin/fullworth-codex-launcher /usr/local/bin/verify-privilege-separation
          ENV CODEX_ARM_DIR=/tmp/fullworth-codex \
              CODEX_HOME=/data/codex \
              CODEX_WORKDIR=/tmp/codex-work \
              CODEX_BRIDGE_KEY_PATH=/tmp/fullworth-codex/bridge_key \
              Security__InternalKey_FILE=/run/fullworth-secrets/backend_internal_key
          ENTRYPOINT ["/usr/local/bin/entrypoint.sh"]
          DOCKERFILE
          docker build -t fullworth-modes -f Dockerfile.modes .

          cat > verify-modes.sh <<'SCRIPT'
          set -e
          # The application's own secrets have to exist first, or "codex cannot read the internal key"
          # would pass because the file is simply absent.
          mkdir -p /run/fullworth-secrets
          head -c 32 /dev/urandom | base64 > /run/fullworth-secrets/backend_internal_key
          head -c 32 /dev/urandom | base64 > /run/fullworth-secrets/data_encryption_key
          chown app:app /run/fullworth-secrets/backend_internal_key /run/fullworth-secrets/data_encryption_key
          chmod 0600 /run/fullworth-secrets/backend_internal_key /run/fullworth-secrets/data_encryption_key

          # Run the entrypoint as a child rather than as the container's entrypoint: it ends in
          # "exec gosu app", and the checks need to still be root afterwards - gosu refuses to run
          # for anyone else, so as app every single one of them would fail for the wrong reason.
          /usr/local/bin/entrypoint.sh /bin/true
          verify-privilege-separation
          SCRIPT
          docker run --rm --entrypoint /bin/sh -v "$PWD/verify-modes.sh:/verify-modes.sh:ro" fullworth-modes /verify-modes.sh

  # What the browser actually reports as layout shift, per page, desktop and phone. Every other
  # frontend guard here compares strings in source files; that catches a rule somebody wrote down and
  # cannot catch a page that jumps, because jumping is a property of the running browser.
  #
  # The budget in the test is a ratchet: it starts at what main measured and may only go down.
  layout-stability:
    name: Layout stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the test project
        run: dotnet build tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj --configuration Release

      - name: Install the browser
        run: pwsh tests/FullWorth.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Measure
        run: dotnet test tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj --configuration Release --no-build --filter "Needs=Browser"
