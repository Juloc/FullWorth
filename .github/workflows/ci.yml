name: CI

# CI is manual by design — run it from the Actions tab or `gh workflow run CI`.
# Do not add push, pull_request, schedule, merge_group, or other automatic triggers.
#
# The backend integration suite (~210 classes, each starting its own WebApplicationFactory host +
# cloned Postgres DB) is the whole cost. It is sharded across parallel jobs by test namespace so the
# wall-clock stays under ~5 min. Juloc/FullWorth is public, so parallel jobs cost no Actions minutes.
# The "rest" shard is the COMPLEMENT of the other four (a NOT-filter), so any namespace not explicitly
# assigned still runs there — new test areas can never silently fall out of CI.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Command Timeout well above the default so a query that runs slowly under load does not surface as an
  # intermittent Npgsql timeout. Sharding keeps per-job parallelism low, so connection pressure stays small.
  FULLWORTH_TEST_POSTGRES: Host=localhost;Port=5432;Username=fullworth_test;Password=fullworth_test_password;Command Timeout=120;Timeout=30

jobs:
  # Compile the whole solution (incl. projects no test references, e.g. CodexBridge) so a build break
  # anywhere still fails CI. Runs in parallel with the test shards, so it does not add wall-clock.
  build:
    name: Build (all projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build FullWorth.slnx --configuration Release

  backend-tests:
    name: Backend · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: purchases
            filter: "FullyQualifiedName~.Purchases.|FullyQualifiedName~.Parity.|FullyQualifiedName~.Performance.|FullyQualifiedName~.Preferences."
          - name: api
            filter: "FullyQualifiedName~.Api.|FullyQualifiedName~.Contracts.|FullyQualifiedName~.Loans.|FullyQualifiedName~.Import."
          - name: intelligence
            filter: "FullyQualifiedName~.Intelligence.|FullyQualifiedName~.Security.|FullyQualifiedName~.Tax.|FullyQualifiedName~.Budgets."
          - name: portfolio
            filter: "FullyQualifiedName~.Portfolio.|FullyQualifiedName~.Transactions.|FullyQualifiedName~.Analytics.|FullyQualifiedName~.Categories.|FullyQualifiedName~.BankConnections."
          - name: rest
            filter: "FullyQualifiedName!~.Purchases.&FullyQualifiedName!~.Parity.&FullyQualifiedName!~.Performance.&FullyQualifiedName!~.Preferences.&FullyQualifiedName!~.Api.&FullyQualifiedName!~.Contracts.&FullyQualifiedName!~.Loans.&FullyQualifiedName!~.Import.&FullyQualifiedName!~.Intelligence.&FullyQualifiedName!~.Security.&FullyQualifiedName!~.Tax.&FullyQualifiedName!~.Budgets.&FullyQualifiedName!~.Portfolio.&FullyQualifiedName!~.Transactions.&FullyQualifiedName!~.Analytics.&FullyQualifiedName!~.Categories.&FullyQualifiedName!~.BankConnections."
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name fullworth-postgres \
            -e POSTGRES_USER=fullworth_test \
            -e POSTGRES_PASSWORD=fullworth_test_password \
            -e POSTGRES_DB=fullworth_test \
            -p 5432:5432 \
            --shm-size=1g \
            postgres:18 -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c shared_buffers=256MB
          for i in $(seq 1 30); do
            if docker exec fullworth-postgres pg_isready -U fullworth_test -d fullworth_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"; docker logs fullworth-postgres; exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test (${{ matrix.name }})
        run: dotnet test tests/FullWorth.Backend.Tests/FullWorth.Backend.Tests.csproj --configuration Release --filter "${{ matrix.filter }}"

  other-tests:
    name: Web + Banking + FinTs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name fullworth-postgres \
            -e POSTGRES_USER=fullworth_test \
            -e POSTGRES_PASSWORD=fullworth_test_password \
            -e POSTGRES_DB=fullworth_test \
            -p 5432:5432 \
            --shm-size=1g \
            postgres:18 -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c shared_buffers=256MB
          for i in $(seq 1 30); do
            if docker exec fullworth-postgres pg_isready -U fullworth_test -d fullworth_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"; docker logs fullworth-postgres; exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test Web
        run: dotnet test tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj --configuration Release

      - name: Test Banking
        run: dotnet test tests/FullWorth.Banking.Tests/FullWorth.Banking.Tests.csproj --configuration Release

      - name: Test FinTs
        run: dotnet test tests/FullWorth.FinTs.Tests/FullWorth.FinTs.Tests.csproj --configuration Release
