name: pwa-runtime-verify

on:
  push:
    branches: [ci/pwa-runtime-verify]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Web/PWA tests
        run: dotnet test tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj --configuration Release -m:1 /p:BuildInParallel=false

      - name: Build unified Web image
        run: docker build -f src/FullWorth.Web/Dockerfile -t fullworth:pwa-verify .
