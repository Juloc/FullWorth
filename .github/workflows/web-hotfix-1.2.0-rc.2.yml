name: One-shot FullWorth web hotfix

on:
  push:
    paths:
      - '.github/workflows/web-hotfix-1.2.0-rc.2.yml'
      - 'src/FullWorth.Web/**'

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify auth binding hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/FullWorth.Web/wwwroot/auth/auth.js").read_text()
          expected = "$('#login-form, #register-form, #forgot-form, #reset-form, #recovery-code-form, #claim-form').forEach"
          assert expected in source, "auth form submit binding hotfix is missing"
          PY

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FullWorth Web 1.2.0-rc.2
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FullWorth.Web/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/juloc/fullworth-web:1.2.0-rc.2
            ghcr.io/juloc/fullworth-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=fullworth-web
          cache-to: type=gha,mode=max,scope=fullworth-web
