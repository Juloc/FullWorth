name: Release Request

on:
  push:
    branches:
      - main
    paths:
      - 'ops/release-request.txt'

permissions:
  contents: write
  actions: write

jobs:
  create-release-tag:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and validate requested version
        id: version
        shell: bash
        run: |
          tag="$(tr -d '[:space:]' < ops/release-request.txt)"
          # 0.80.0, 1.4.0 (stable: moves "latest") or 0.81.0-rc.1, 1.4.0-alpha.2 (pre-release: does not)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9]+)?)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          # A stable release needs its notes in ops/release-notes.md, headed by its own version, so that
          # notes from the last release can never be published under this one. Checked BEFORE the tag is
          # created: a failed release burns its tag, a failed check burns nothing.
          if [[ "$tag" != *-* ]]; then
            if [[ ! -s ops/release-notes.md ]]; then
              echo "ops/release-notes.md is missing or empty; a stable release needs release notes." >&2
              exit 1
            fi
            heading="$(head -n 1 ops/release-notes.md | tr -d '[:space:]')"
            if [[ "$heading" != "#${tag}" && "$heading" != "#${tag#v}" ]]; then
              echo "ops/release-notes.md must start with '# ${tag#v}' (found: $heading)." >&2
              exit 1
            fi
          fi

          git fetch --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; reusing it."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          source_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -z "$source_sha" ]]; then
            source_sha="$GITHUB_SHA"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "FullWorth ${TAG#v}"
          git push origin "$TAG"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        shell: bash
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="$TAG" \
            -f source_sha="$SOURCE_SHA"
