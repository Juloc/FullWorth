name: WASM compensation calculator

# Manual by design, like CI, and deliberately SEPARATE from it.
#
# The build needs the wasm-tools workload. FullWorth.Compensation.Wasm is therefore NOT part of
# FullWorth.slnx and not in any Dockerfile: if it were, every CI job and every release image would
# have to install that workload first, and a workload install failing on a runner would take the
# release down with it. The app does not need this artifact to run - it is for the public landing
# page, which loads it as a static asset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Publish browser-wasm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish src/FullWorth.Compensation.Wasm/FullWorth.Compensation.Wasm.csproj -c Release -o publish
      # The landing page needs main.js, dotnet.js and the _framework payload. If any of those is
      # missing the bundle is useless, so fail here rather than shipping a broken folder.
      # List before asserting: a failing assertion on an unknown layout tells you nothing, and the
      # published layout for a browser-wasm console project is not the same as Blazor's.
      - name: Show what was published
        run: find publish -maxdepth 3 -type f | sort | head -60
      - name: Check the bundle is complete
        run: |
          set -eu
          root=publish/wwwroot
          test -d "$root" || root=publish
          test -f "$root/main.js" || { echo "main.js missing under $root"; exit 1; }
          test -f "$root/_framework/dotnet.js" || { echo "_framework/dotnet.js missing under $root"; exit 1; }
          test -n "$(find "$root/_framework" -name 'FullWorth.Compensation.Core*' -print -quit)" \
            || { echo "the calculator assembly is not in the bundle"; exit 1; }
          echo "bundle root: $root"
          echo "bundle size: $(du -sh "$root" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: compensation-wasm
          path: publish
          if-no-files-found: error
