name: WASM compensation calculator

# Manual by design, like CI, and deliberately SEPARATE from it.
#
# The build needs the wasm-tools workload. FullWorth.Compensation.Wasm is therefore NOT part of
# FullWorth.slnx and not in any Dockerfile: if it were, every CI job and every release image would
# have to install that workload first, and a workload install failing on a runner would take the
# release down with it. The app does not need this artifact to run - it is for the public landing
# page, which loads it as a static asset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Publish browser-wasm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish src/FullWorth.Compensation.Wasm/FullWorth.Compensation.Wasm.csproj -c Release -o publish
      # List before asserting - a failing assertion on an unknown layout tells you nothing. Skip the
      # hundreds of fingerprinted assemblies in _framework or the listing is all noise and gets cut off
      # before the interesting files (that alone cost a round trip).
      - name: Show what was published
        run: |
          find publish -maxdepth 2 -type f -not -path '*/_framework/*' | sort
          echo "--- _framework entry points ---"
          find publish -path '*/_framework/*' \( -name 'dotnet*.js' -o -name '*.json' \) | sort
      # What the landing page actually needs: the calculator compiled into the bundle, and a runtime
      # loader to start it. The JS glue is NOT asserted - it is twelve lines that belong to the page,
      # and this SDK does not copy it into the bundle.
      - name: Check the bundle is complete
        run: |
          set -eu
          root=publish/wwwroot
          test -d "$root/_framework" || { echo "no _framework: this is not a browser bundle"; exit 1; }
          test -n "$(find "$root/_framework" -name 'FullWorth.Compensation.Core*.wasm' -print -quit)" \
            || { echo "the calculator assembly is not in the bundle"; exit 1; }
          loader=$(find publish -name 'dotnet.js' -print -quit)
          test -n "$loader" || { echo "no dotnet.js loader anywhere in the publish output"; exit 1; }
          echo "loader: $loader"
          echo "bundle size: $(du -sh "$root" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: compensation-wasm
          path: publish
          if-no-files-found: error
