name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.3.0-alpha.1
        required: true
        type: string
      source_sha:
        description: Exact commit SHA to build and publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

jobs:
  build-amd64:
    name: AMD64 · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fullworth
            image: fullworth
            dockerfile: src/FullWorth.Web/Dockerfile
          - service: codex
            image: fullworth-codex
            dockerfile: src/FullWorth.CodexBridge/Dockerfile

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate version and prepare tags
        id: vars
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sha_tag="sha-${SOURCE_SHA::7}"

          {
            echo 'tags<<EOF'
            echo "$image:$version"
            echo "$image:$sha_tag"
            echo "$image:$version-amd64"
            echo "$image:$sha_tag-amd64"

            if [[ "$version" != *-* ]]; then
              major="${version%%.*}"
              rest="${version#*.}"
              minor="${rest%%.*}"
              echo "$image:$major"
              echo "$image:$major.$minor"
              echo "$image:latest"
              echo "$image:$major-amd64"
              echo "$image:$major.$minor-amd64"
              echo "$image:latest-amd64"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-amd64

  build-arm64:
    name: ARM64 · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fullworth
            image: fullworth
            dockerfile: src/FullWorth.Web/Dockerfile
          - service: codex
            image: fullworth-codex
            dockerfile: src/FullWorth.CodexBridge/Dockerfile

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate version and prepare ARM tags
        id: vars
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sha_tag="sha-${SOURCE_SHA::7}"

          {
            echo 'tags<<EOF'
            echo "$image:$version-arm64"
            echo "$image:$sha_tag-arm64"

            if [[ "$version" != *-* ]]; then
              major="${version%%.*}"
              rest="${version#*.}"
              minor="${rest%%.*}"
              echo "$image:$major-arm64"
              echo "$image:$major.$minor-arm64"
              echo "$image:latest-arm64"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-amd64

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          args=(release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "FullWorth $version" --generate-notes --verify-tag)

          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh "${args[@]}"
          fi

  multiarch:
    name: Multi-Arch · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fullworth
            image: fullworth
          - service: codex
            image: fullworth-codex

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sha_tag="sha-${SOURCE_SHA::7}"

          merge_tag() {
            tag="$1"
            docker buildx imagetools create \
              --tag "$image:$tag" \
              "$image:$tag-amd64" \
              "$image:$tag-arm64"
          }

          merge_tag "$version"
          merge_tag "$sha_tag"

          if [[ "$version" != *-* ]]; then
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            merge_tag "$major"
            merge_tag "$major.$minor"
            merge_tag "latest"
          fi
