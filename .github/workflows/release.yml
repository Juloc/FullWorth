name: Release

on:
  push:
    branches:
      - 'release-build/1.2.0-rc.7-hotfix'
    paths:
      - 'ops/release-build-1.2.0-rc.7-hotfix.trigger'

permissions:
  contents: write
  packages: write

jobs:
  validate-web:
    runs-on: ubuntu-latest
    env:
      FULLWORTH_TEST_POSTGRES: Host=localhost;Port=5432;Username=fullworth_test;Password=fullworth_test_password;Command Timeout=120;Timeout=30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name fullworth-postgres \
            -e POSTGRES_USER=fullworth_test \
            -e POSTGRES_PASSWORD=fullworth_test_password \
            -e POSTGRES_DB=fullworth_test \
            -p 5432:5432 \
            --shm-size=1g \
            postgres:18 -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c shared_buffers=256MB
          for i in $(seq 1 30); do
            if docker exec fullworth-postgres pg_isready -U fullworth_test -d fullworth_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs fullworth-postgres
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Web tests
        run: dotnet restore tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj

      - name: Build Web tests
        run: dotnet build tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj --configuration Release --no-restore

      - name: Test login and session integration
        run: dotnet test tests/FullWorth.Web.Tests/FullWorth.Web.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~FullWorth.Web.Tests.Auth.AuthIntegrationTests

  web-image:
    needs: validate-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FullWorth Web rc.7
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FullWorth.Web/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/juloc/fullworth-web:1.2.0-rc.7
            ghcr.io/juloc/fullworth-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=fullworth-web
          cache-to: type=gha,mode=max,scope=fullworth-web

  publish-marker:
    needs: web-image
    runs-on: ubuntu-latest
    steps:
      - name: Mark rc.7 web image as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload="$(printf 'FullWorth Web 1.2.0-rc.7 published successfully.\nSource: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" | base64 -w0)"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/release-build-1.2.0-rc.7-hotfix.complete" \
            --data "{\"message\":\"build: mark FullWorth Web 1.2.0-rc.7 published\",\"content\":\"$payload\",\"branch\":\"$GITHUB_REF_NAME\"}"
