name: One-off transaction normalization patch

on:
  push:
    branches:
      - fix/transaction-display-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/transaction-display-normalization
          fetch-depth: 0

      - name: Apply source patch
        run: python .github/scripts/oneoff_transaction_normalization.py

      - name: Check JavaScript syntax
        run: node --check src/FullWorth.Web/wwwroot/features/transactions.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build FullWorth.slnx --configuration Release

      - name: Banking tests
        run: dotnet test tests/FullWorth.Banking.Tests/FullWorth.Banking.Tests.csproj --configuration Release --no-build

      - name: Remove one-off patch files and commit
        run: |
          rm .github/scripts/oneoff_transaction_normalization.py
          rm .github/workflows/transaction-normalization-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize transaction dates and list metadata"
          git push origin HEAD:fix/transaction-display-normalization
