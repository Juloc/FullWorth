<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>FullWorth Admin</title>
  <link rel="icon" type="image/svg+xml" href="/pwa/icon-light.svg?v=5" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/pwa/icon-dark.svg?v=5" media="(prefers-color-scheme: dark)">
  <!-- Applies the theme the user picked in the app. Without it this page was locked to the OS
       preference via its own prefers-color-scheme block, so a user on a light theme with a dark OS
       got a dark admin page. -->
  <script src="/theme-init.js"></script>
  <!-- The same layer chain as index.html and the import pages: this page used to bring its own
       colours, buttons and dialog styling, which is how it drifted away from the app. -->
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/styles/shell.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/styles/responsive.css">
  <link rel="stylesheet" href="/design-depth.css">
  <link rel="stylesheet" href="/dialogs.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <span class="admin-eyebrow">FullWorth</span>
        <h1>Admin</h1>
        <p>Userverwaltung ohne Zugriff auf Finanzdaten.</p>
      </div>
      <a href="/" class="btn btn-secondary">← FullWorth</a>
    </header>

    <section id="overview" class="admin-metrics" aria-label="Übersicht">
      <article><span>User</span><strong id="metric-users">–</strong></article>
      <article><span>Aktiv</span><strong id="metric-active">–</strong></article>
      <article><span>Gesperrt</span><strong id="metric-disabled">–</strong></article>
      <article><span>Löschung</span><strong id="metric-deleting">–</strong></article>
      <article><span>Fehler</span><strong id="metric-failed">–</strong></article>
      <article><span>Admins</span><strong id="metric-admins">–</strong></article>
    </section>

    <section class="panel">
      <div class="admin-toolbar">
        <input id="search" type="search" placeholder="E-Mail oder User-ID suchen" autocomplete="off">
        <select id="status">
          <option value="">Alle</option>
          <option value="active">Aktiv</option>
          <option value="disabled">Gesperrt</option>
          <option value="deleting">Löschung</option>
          <option value="admins">Admins</option>
        </select>
        <button id="refresh" type="button" class="btn btn-secondary">Aktualisieren</button>
      </div>
      <div id="users" class="admin-users"></div>
      <div class="admin-pager">
        <button id="prev" type="button" class="btn btn-secondary">Zurück</button>
        <span id="page-info" class="row-sub"></span>
        <button id="next" type="button" class="btn btn-secondary">Weiter</button>
      </div>
    </section>

    <div id="admin-toast" role="status" aria-live="polite"></div>
  </main>
  <script src="/security/browser-fetch.js"></script>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
