<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FullWorth</title>
  <link rel="icon" type="image/svg+xml" href="/pwa/icon.svg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/auth/auth.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <main class="auth-main">
      <div class="auth-hero">
        <img class="auth-hero-logo" src="/branding/fullworth-logo.svg" alt="" aria-hidden="true">
        <p class="auth-hero-name">FullWorth<span class="auth-hero-beta">Beta</span></p>
      </div>
      <article class="auth-card" aria-live="polite">
        <div id="auth-session-status" class="auth-message auth-message-status" role="status" hidden></div>

        <section data-auth-view="login">
          <div class="auth-heading">
            <h1 data-auth-page-title data-i18n="auth.pages.login.title"></h1>
          </div>

          <form id="login-form" class="auth-form" method="post" action="/auth/login" novalidate>
            <label for="login-email">
              <span data-i18n="auth.email"></span>
              <input id="login-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
            </label>

            <label for="login-password">
              <span data-i18n="auth.password"></span>
              <span class="password-control">
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" data-auth-action="toggle-password" data-target="login-password" aria-controls="login-password" aria-pressed="false" data-i18n-aria-label="auth.showPassword" data-i18n-title="auth.showPassword">
                  <svg class="pw-eye pw-eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="pw-eye pw-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 5.2A9.4 9.4 0 0 1 12 5c6.4 0 10 7 10 7a17.3 17.3 0 0 1-3.1 3.9"/><path d="M6.1 6.1A17.2 17.2 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 3-.5"/></svg>
                </button>
              </span>
            </label>

            <div id="login-error" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.invalidCredentials"></div>
            <div id="login-unavailable" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.signInUnavailable"></div>

            <button class="auth-primary" type="submit" data-i18n="auth.signIn" data-loading-i18n="auth.signingIn"></button>
          </form>

          <div class="auth-links">
            <a href="/auth/index.html?view=forgot-password" data-i18n="auth.forgotPassword"></a>
            <a href="/auth/register" data-i18n="auth.createAccount"></a>
          </div>

          <div class="auth-divider" aria-hidden="true"><span></span></div>

          <button class="auth-secondary" type="button" data-auth-action="passkey-login" data-i18n="auth.passkey"></button>
          <div id="passkey-status" class="auth-message auth-message-status" role="status" hidden data-i18n="auth.passkeyUnavailable"></div>
        </section>


        <section data-auth-view="register" hidden>
          <div class="auth-heading">
            <h1 data-auth-page-title data-i18n="auth.pages.register.title"></h1>
            <p data-i18n="auth.pages.register.subtitle"></p>
          </div>

          <form id="register-form" class="auth-form" method="post" action="/auth/register" novalidate>
            <label for="register-name">
              <span data-i18n="auth.displayName"></span>
              <input id="register-name" name="displayName" type="text" autocomplete="name" maxlength="200" required>
            </label>

            <label for="register-email">
              <span data-i18n="auth.email"></span>
              <input id="register-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
            </label>

            <label for="register-password">
              <span data-i18n="auth.password"></span>
              <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="register-password-help">
            </label>
            <p id="register-password-help" class="auth-help" data-i18n="auth.passwordHelp"></p>

            <label for="register-confirm-password">
              <span data-i18n="auth.confirmPassword"></span>
              <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required aria-describedby="register-password-mismatch">
            </label>
            <div id="register-password-mismatch" class="auth-field-error" role="alert" hidden data-i18n="auth.passwordMismatch"></div>

            <label class="check">
              <input id="register-terms" name="acceptTerms" type="checkbox" required>
              <span data-i18n="auth.acceptTerms"></span>
            </label>

            <div id="register-error" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.registrationUnavailable"></div>
            <div id="register-disabled" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.registrationDisabled"></div>

            <button class="auth-primary" type="submit" data-i18n="auth.register" data-loading-i18n="auth.registering"></button>
          </form>

          <div class="auth-links">
            <a href="/auth/login" data-i18n="auth.backToSignIn"></a>
            <a href="https://fullworth.de/privacy/" data-i18n="auth.privacy" target="_blank" rel="noopener"></a>
            <a href="https://fullworth.de/terms/" data-i18n="auth.terms" target="_blank" rel="noopener"></a>
          </div>
        </section>

        <section data-auth-view="forgot-password" hidden>
          <div class="auth-heading">
            <h1 data-auth-page-title data-i18n="auth.pages.forgot-password.title"></h1>
            <p data-i18n="auth.pages.forgot-password.subtitle"></p>
          </div>

          <form id="forgot-form" class="auth-form" method="post" action="/auth/password-reset/request" novalidate>
            <label for="forgot-email">
              <span data-i18n="auth.email"></span>
              <input id="forgot-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
            </label>
            <button class="auth-primary" type="submit" data-i18n="auth.continue" data-loading-i18n="auth.sending"></button>
          </form>

          <div id="forgot-confirmation" class="auth-message auth-message-success" role="status" hidden data-i18n="auth.forgotConfirmation"></div>
          <div id="forgot-error" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.genericError"></div>

          <div class="auth-links">
            <a href="/auth/index.html?view=login" data-i18n="auth.backToSignIn"></a>
          </div>
        </section>

        <section data-auth-view="reset-password" hidden>
          <div class="auth-heading">
            <h1 data-auth-page-title data-i18n="auth.pages.reset-password.title"></h1>
            <p data-i18n="auth.pages.reset-password.subtitle"></p>
          </div>

          <form id="reset-form" class="auth-form" method="post" action="/auth/password-reset/complete" novalidate>
            <label for="new-password">
              <span data-i18n="auth.newPassword"></span>
              <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required aria-describedby="password-help">
            </label>
            <p id="password-help" class="auth-help" data-i18n="auth.passwordHelp"></p>

            <label for="confirm-password">
              <span data-i18n="auth.confirmPassword"></span>
              <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="password-mismatch">
            </label>
            <div id="password-mismatch" class="auth-field-error" role="alert" hidden data-i18n="auth.passwordMismatch"></div>

            <button class="auth-primary" type="submit" data-i18n="auth.resetPassword" data-loading-i18n="auth.resetting"></button>
          </form>

          <div id="reset-invalid" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.invalidResetLink"></div>
          <div id="reset-error" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.genericError"></div>
          <div id="reset-success" class="auth-message auth-message-success auth-final-state" role="status" hidden>
            <strong data-i18n="auth.passwordChanged"></strong>
            <a class="auth-primary auth-link-button" href="/auth/index.html?view=login" data-i18n="auth.signInAgain"></a>
          </div>

          <div class="auth-links">
            <a href="/auth/index.html?view=login" data-i18n="auth.backToSignIn"></a>
          </div>
        </section>

        <section data-auth-view="claim" hidden>
          <div class="auth-heading">
            <h1 data-auth-page-title data-i18n="auth.pages.claim.title"></h1>
            <p data-i18n="auth.pages.claim.subtitle"></p>
          </div>

          <form id="claim-form" class="auth-form" method="post" action="/auth/claim" novalidate>
            <label for="claim-new-password">
              <span data-i18n="auth.newPassword"></span>
              <input id="claim-new-password" name="newPassword" type="password" autocomplete="new-password" required aria-describedby="claim-password-help">
            </label>
            <p id="claim-password-help" class="auth-help" data-i18n="auth.passwordHelp"></p>

            <label for="claim-confirm-password">
              <span data-i18n="auth.confirmPassword"></span>
              <input id="claim-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="claim-password-mismatch">
            </label>
            <div id="claim-password-mismatch" class="auth-field-error" role="alert" hidden data-i18n="auth.passwordMismatch"></div>

            <button class="auth-primary" type="submit" data-i18n="auth.claimSubmit" data-loading-i18n="auth.claimSubmitting"></button>
          </form>

          <div id="claim-invalid" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.claimInvalid"></div>
          <div id="claim-error" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.genericError"></div>
          <div id="claim-existing" class="auth-message auth-message-success auth-final-state" role="status" hidden>
            <strong data-i18n="auth.claimExisting"></strong>
            <a class="auth-primary auth-link-button" href="/auth/index.html?view=login" data-i18n="auth.signInAgain"></a>
          </div>

          <div class="auth-links">
            <a href="/auth/index.html?view=login" data-i18n="auth.backToSignIn"></a>
          </div>
        </section>

        <section data-auth-view="recovery-code" hidden>
          <div class="auth-heading">
            <h1 data-auth-page-title data-i18n="auth.pages.recovery-code.title"></h1>
            <p data-i18n="auth.pages.recovery-code.subtitle"></p>
          </div>

          <form id="recovery-code-form" class="auth-form" method="post" action="/auth/recovery-code/redeem" novalidate>
            <label for="recovery-email">
              <span data-i18n="auth.email"></span>
              <input id="recovery-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
            </label>
            <label for="recovery-code">
              <span data-i18n="auth.recoveryCode"></span>
              <input id="recovery-code" name="recoveryCode" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required aria-describedby="recovery-code-help">
            </label>
            <p id="recovery-code-help" class="auth-help" data-i18n="auth.recoveryCodeHelp"></p>
            <button class="auth-primary" type="submit" data-auth-action="recovery-code-submit" data-i18n="auth.useRecoveryCode"></button>
          </form>

          <div id="recovery-code-error" class="auth-message auth-message-error" role="alert" hidden data-i18n="auth.recoveryError"></div>

          <div class="auth-links">
            <a href="/auth/index.html?view=login" data-i18n="auth.backToSignIn"></a>
          </div>
        </section>

        <section data-auth-view="recovery-codes" hidden>
          <div class="auth-heading">
            <h1 data-auth-page-title data-i18n="auth.pages.recovery-codes.title"></h1>
            <p data-i18n="auth.pages.recovery-codes.subtitle"></p>
          </div>

          <div class="auth-message auth-message-warning" role="status">
            <strong data-i18n="auth.recoveryCodesShownOnce"></strong>
            <span data-i18n="auth.recoveryCodesStoreSecurely"></span>
          </div>

          <ol id="recovery-codes-list" class="recovery-codes" aria-live="polite"></ol>
          <p id="recovery-codes-remaining" class="auth-help" hidden></p>

          <button id="copy-recovery-codes" class="auth-secondary" type="button" data-auth-action="copy-recovery-codes" data-i18n="auth.copyAll" disabled></button>
          <div id="copy-recovery-status" class="auth-message auth-message-status" role="status" hidden data-i18n="auth.copied"></div>

          <div class="auth-links">
            <a href="/auth/index.html?view=login" data-i18n="auth.backToSignIn"></a>
          </div>
        </section>
      </article>
    </main>

    <footer class="auth-footer">FullWorth<span class="auth-version" id="app-version" hidden></span></footer>

    <div class="auth-utility">
      <button type="button" id="auth-language" class="auth-util-btn" data-i18n-aria-label="auth.language" data-i18n-title="auth.language">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9Z"/></svg>
        <span class="auth-util-label" id="auth-language-label"></span>
      </button>
      <button type="button" id="auth-theme" class="auth-util-btn" data-theme-pref="system" data-i18n-aria-label="auth.theme" data-i18n-title="auth.theme">
        <svg data-theme-icon="system" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <svg data-theme-icon="light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-theme-icon="dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </div>

  <script type="module" src="/auth/auth.js"></script>
</body>
</html>
